name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - extension/**
      - ios/**
      - .github/workflows/testflight.yml

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: テスト
        run: node --test tests/*.test.js

      - name: App Store Connect APIキーを配置
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: ビルドしてTestFlightへアップロード
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID || 'me.tinykitten.kittan-radar' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUILD_NUMBER: ${{ github.run_number }}
        run: ios/build.sh

      - name: ログを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: |
            build/ios/export/*.log
            ~/Library/Logs/DiagnosticReports/*
          if-no-files-found: ignore

      - name: APIキーを削除
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
